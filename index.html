<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RALKO | Official Links & Hub</title>
    <link rel="stylesheet" href="style.css?v=4">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="bg-glow"></div>

    <!-- Background Audio Player (Fixed Widget) -->
    <audio id="bg-music" src="https://a.top4top.io/m_39792evr41.mp3" loop></audio>
    <div class="music-widget" id="music-toggle" title="Play / Pause Music">
        <i class="fa-solid fa-music" id="music-icon"></i>
        <span id="music-text">Play OST</span>
    </div>

    <main class="container">
        <!-- Terminal Header with Live Counter -->
        <div class="terminal-bar">
            <div class="visitor-counter">
                <i class="fa-solid fa-eye"></i>
                <span id="views-count">...</span>
            </div>
            <span class="file-name" style="color: var(--blue-primary); font-weight: 600;">Welcome To My Profile</span>
            <span class="git-branch"><i class="fa-solid fa-code-branch"></i> main</span>
        </div>

        <div class="content">
            <div class="avatar-wrapper">
                <img src="profile.png" alt="RALKO Logo" class="avatar">
                <span class="status-badge" title="Online"></span>
            </div>

            <h1 class="username"><span class="typing-text">RALKO</span></h1>

            <div class="badges">
                <span class="badge"><i class="fa-solid fa-video"></i> Content Creator</span>
                <span class="badge"><i class="fa-solid fa-gamepad"></i> Gamer</span>
                <span class="badge"><i class="fa-solid fa-code"></i> Developer</span>
            </div>

            <!-- Pro Neon Bio Card -->
            <div class="bio-card">
                <p>Welcome to the website <strong>RALKO</strong>. This website contains all the information about what I do.</p>
            </div>

            <!-- All Links -->
            <div class="links">
                <a href="https://youtube.com/@ralkotv?si=vCSwVJYwhl1GmXTS" target="_blank" class="link-card youtube">
                    <i class="fa-brands fa-youtube"></i>
                    <span>YouTube</span>
                    <small>@ralkotv</small>
                </a>

                <a href="https://www.tiktok.com/@ralko.tv" target="_blank" class="link-card tiktok">
                    <i class="fa-brands fa-tiktok"></i>
                    <span>TikTok</span>
                    <small>@ralko.tv</small>
                </a>

                <a href="https://kick.com/R4LKO" target="_blank" class="link-card kick">
                    <i class="fa-solid fa-video-camera"></i>
                    <span>Kick</span>
                    <small>@R4LKO</small>
                </a>

                <a href="https://open.spotify.com/user/31yxd4e3fv3oulo3hduqsyyy52wa?si=2bGCeC49QBC1HzRRXux84g" target="_blank" class="link-card spotify">
                    <i class="fa-brands fa-spotify"></i>
                    <span>Spotify</span>
                    <small>Profile</small>
                </a>

                <a href="https://discord.gg/WMUEkYcm9W" target="_blank" class="link-card discord">
                    <i class="fa-brands fa-discord"></i>
                    <span>Discord Server</span>
                    <small>Join Community</small>
                </a>
            </div>

            <footer>
                <p>© 2026 Site Create By <span style="color: var(--blue-primary); font-weight: bold;">Ralko</span></p>
            </footer>
        </div>
    </main>

    <!-- Scripts (Visitor Counter & Music Player Control) -->
    <script>
        // Visitor Counter
        fetch('https://abacus.jasoncameron.dev/hit/ralko-portfolio/visits')
            .then(res => res.json())
            .then(data => {
                document.getElementById('views-count').innerText = data.value;
            })
            .catch(() => {
                let localViews = localStorage.getItem('ralko_views') || 1;
                document.getElementById('views-count').innerText = localViews;
                localStorage.setItem('ralko_views', Number(localViews) + 1);
            });

        // Music Player Logic
        const music = document.getElementById('bg-music');
        const musicToggle = document.getElementById('music-toggle');
        const musicIcon = document.getElementById('music-icon');
        const musicText = document.getElementById('music-text');

        music.volume = 0.5; // Sound level (50%)

        musicToggle.addEventListener('click', () => {
            if (music.paused) {
                music.play();
                musicIcon.className = "fa-solid fa-volume-high";
                musicText.innerText = "Playing";
                musicToggle.style.borderColor = "#22c55e";
            } else {
                music.pause();
                musicIcon.className = "fa-solid fa-volume-xmark";
                musicText.innerText = "Muted";
                musicToggle.style.borderColor = "#ff0000";
            }
        });

        // Try to autoplay on first interaction if blocked by browser
        window.addEventListener('click', () => {
            if (music.paused && music.currentTime === 0) {
                music.play().then(() => {
                    musicIcon.className = "fa-solid fa-volume-high";
                    musicText.innerText = "Playing";
                }).catch(() => {});
            }
        }, { once: true });
    </script>
</body>
</html>
